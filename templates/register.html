{% extends "base.html" %}
{% block title %}Register — BharatVerse{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <h2>🏺 Begin Your Journey</h2>
    <p class="auth-subtitle">Create your account and step into the Time Machine.</p>
    <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus minlength="3">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6">

      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="6">

      <button type="submit" class="btn btn-primary btn-full">Create Account</button>
    </form>
    <p class="auth-switch">Already an explorer? <a href="{{ url_for('auth.login') }}">Login</a></p>
  </div>
</section>
{% endblock %}
